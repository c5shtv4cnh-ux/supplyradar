<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SupplyRadar</title>
  <meta name="description" content="Сфотографируйте накладную: SupplyRadar сверит цены с прошлыми поставками и сообщит, если поставщик поднял цену.">
  <meta property="og:title" content="SupplyRadar: цены поставщиков под присмотром">
  <meta property="og:description" content="Фото накладной, проверка AI и алерт о росте цены в тот же день.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#14213d">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="preload" href="fonts/onest-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#app">К содержимому</a>
  <header class="topbar" id="topbar" hidden>
    <a class="brand" href="#/invoices">
      <img src="favicon.svg" alt="" width="30" height="30">
      <span>SupplyRadar</span>
    </a>
    <nav class="nav" id="nav" aria-label="Разделы">
      <a href="#/invoices" data-nav="invoices">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h7"/></svg>
        <span>Накладные</span>
      </a>
      <a href="#/products" data-nav="products">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Товары</span>
      </a>
      <a href="#/alerts" data-nav="alerts">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>
        <span>Алерты</span><b class="count" id="alert-count" hidden></b>
      </a>
      <a href="#/settings" data-nav="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
        <span>Настройки</span>
      </a>
      <a href="#/more" data-nav="more">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        <span>Ещё</span>
      </a>
    </nav>
    <button class="link" id="logout" type="button">Выйти</button>
  </header>

  <div class="offline" id="offline" role="status" hidden>Нет подключения к интернету. Данные обновятся, когда связь вернётся.</div>

  <main id="app" class="container" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
