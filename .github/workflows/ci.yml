name: ci

# Checks only. Nothing in this file changes AWS: the plan jobs are read-only
# and stay skipped until the OIDC roles exist and their ARNs are saved as
# repository variables (docs/cicd.md).

on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # reused by deploy.yml: a deploy never starts on red checks

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: 1.13.3

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/unit
      - name: Load-test tool self-check (local fake backend, no AWS)
        run: python3 tests/load/load_test.py --local --stages 2,4 --stage-seconds 3 --out /tmp/load-selfcheck --no-chart

  ui:
    name: UI and accessibility tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: npm install --no-audit --no-fund
        working-directory: tests/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: tests/e2e
      - name: Start the local fake backend
        run: |
          python3 tests/e2e/fake_backend.py > fake_backend.log 2>&1 &
          sleep 3
      - name: Browser tests, then axe (WCAG 2.2 AA) on every screen
        working-directory: tests/e2e
        run: npm test
      - name: Backend log on failure
        if: failure()
        run: cat fake_backend.log

  terraform:
    name: Terraform fmt, validate, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test # plans the whole stack against a mocked AWS provider

  security:
    name: Security scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install checkov==3.4.5
      # Accepted exceptions, each with its reason, are listed in .checkov.yaml.
      - run: checkov --config-file .checkov.yaml

  plan:
    name: Terraform plan (${{ matrix.environment }})
    # Runs once the plan role exists: repository variables AWS_PLAN_ROLE_ARN
    # (dev), AWS_PLAN_ROLE_ARN_PROD (prod), TF_STATE_BUCKET and ALARM_EMAIL.
    if: github.event_name == 'pull_request' && vars.AWS_PLAN_ROLE_ARN != ''
    needs: [python, terraform]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, prod]
    env:
      ROLE_ARN: ${{ matrix.environment == 'prod' && vars.AWS_PLAN_ROLE_ARN_PROD || vars.AWS_PLAN_ROLE_ARN }}
      HAS_ROLE: ${{ (matrix.environment == 'prod' && vars.AWS_PLAN_ROLE_ARN_PROD || matrix.environment == 'dev' && vars.AWS_PLAN_ROLE_ARN) && 'yes' || 'no' }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_alarm_email: ${{ vars.ALARM_EMAIL }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
    defaults:
      run:
        working-directory: terraform
        shell: bash # with pipefail: a failed command before `| tee` fails the step
    steps:
      - name: Skip note
        if: env.HAS_ROLE == 'no'
        working-directory: .
        run: echo "No plan role for ${{ matrix.environment }} yet (docs/cicd.md), skipping." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
        if: env.HAS_ROLE == 'yes'
      - name: Check settings
        if: env.HAS_ROLE == 'yes'
        working-directory: .
        run: |
          test -n "$TF_STATE_BUCKET" || { echo "::error::Repository variable TF_STATE_BUCKET is not set"; exit 1; }
          test -n "$TF_VAR_alarm_email" || { echo "::error::Repository variable ALARM_EMAIL is not set"; exit 1; }
      - uses: aws-actions/configure-aws-credentials@v4
        if: env.HAS_ROLE == 'yes'
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: eu-central-1
      - uses: hashicorp/setup-terraform@v3
        if: env.HAS_ROLE == 'yes'
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: init
        if: env.HAS_ROLE == 'yes'
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=supplyradar/${{ matrix.environment }}/terraform.tfstate" \
            -backend-config="region=eu-central-1" \
            -backend-config="use_lockfile=true"
      - name: plan
        if: env.HAS_ROLE == 'yes'
        run: |
          # Same switches the owner used when creating the roles, so that the plan
          # does not propose to delete the deploy role or the OIDC provider.
          EXTRA=""
          [ "${{ matrix.environment }}" = "prod" ] && EXTRA="-var=create_github_oidc_provider=false"
          [ -n "${{ matrix.environment == 'prod' && vars.AWS_DEPLOY_ROLE_ARN_PROD || vars.AWS_DEPLOY_ROLE_ARN }}" ] && EXTRA="$EXTRA -var=enable_github_deploy=true"
          terraform plan -input=false -no-color -lock-timeout=60s \
            -var-file=envs/${{ matrix.environment }}.tfvars $EXTRA | tee plan.txt
          {
            echo '### terraform plan (${{ matrix.environment }})'
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || tail -n 5 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
